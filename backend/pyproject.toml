[project]
name = "study-coach-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=43.0",
    "httpx>=0.27",
    "redis>=5.2",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    # fakeredis chỉ thực thi được Lua (EVAL/EVALSHA) khi có lupa; thiếu nó, mọi
    # test dùng script Lua (Task 15 — thùng token) sẽ không chạy được script thật,
    # nghĩa là test xanh mà không chứng minh được gì về hành vi thật sẽ chạy khi
    # triển khai.
    "lupa>=2.2",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Ghim theo scope "session" để khớp vòng đời của engine dùng chung; nếu không,
# fixture "tao_bang" (session) và các test (function) sẽ chạy trên các event loop
# khác nhau, khiến kết nối asyncpg dùng lại giữa hai loop bị lỗi RuntimeError.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "live: gọi nhà cung cấp LLM thật, bị loại khỏi lần chạy mặc định",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
# Các file migration alembic là bản ghi lịch sử của những gì đã áp dụng lên CSDL
# thật; không sửa theo style để tránh làm lệch nội dung file so với migration
# đã chạy trên CSDL.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dùng Depends(...)/HTTPBearer(...) làm giá trị mặc định của tham số -
# đây là idiom bắt buộc của framework để dependency injection hoạt động, không
# phải lỗi thực sự. Không xóa ignore này để "dọn dẹp".
"app/modules/auth/router.py" = ["B008"]
"app/modules/auth/deps.py" = ["B008"]
